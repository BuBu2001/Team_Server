[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shop"
version = "1.4.2"
description = "Order and catalogue API for the sample storefront."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "redis>=5.0",
  "celery>=5.3",
  "httpx>=0.27",
  "stripe>=8.0",
  "click>=8.1",
  "pydantic>=2.6",
]

[project.scripts]
shopctl = "shop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
