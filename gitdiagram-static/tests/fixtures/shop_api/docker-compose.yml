services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://shop:shop@db:5432/shop
  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
  cache:
    image: redis:7-alpine
  worker:
    build: .
    command: celery -A shop.workers worker
volumes:
  pgdata:
