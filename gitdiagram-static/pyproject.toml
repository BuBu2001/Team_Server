[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "staticdiagram"
version = "0.1.0"
description = "Architecture diagrams for Python repositories from static analysis only — no LLM, no API keys."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["architecture", "diagram", "static-analysis", "mermaid", "dependency-graph"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Documentation",
]
# Zero runtime dependencies on purpose: the analyser must run in a bare
# container, a CI job or an air-gapped machine.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
staticdiagram = "staticdiagram.cli:main"
gitdiagram-static = "staticdiagram.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
