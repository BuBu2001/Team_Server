<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Team Server{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">🖥 Team<span>Server</span></a>
  {% if user %}
  <nav class="topnav">
    <a href="/dashboard">Панель</a>
    <span class="badge {{ user.role }}">{{ user.role|upper }}</span>
    <span class="nick">@{{ user.username }}</span>
    <form method="post" action="/logout" class="inline"><button class="btn btn-sm">Выйти</button></form>
  </nav>
  {% endif %}
</header>
<main class="container">
{% block content %}{% endblock %}
</main>
<footer class="foot">Работает в локальной сети · анализ проектов через gitingest</footer>
</body>
</html>
