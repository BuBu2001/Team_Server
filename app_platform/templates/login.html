{% extends "base.html" %}
{% block title %}Вход — Team Server{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Team Server</h1>
  <p class="muted">Локальная платформа для команд. Регистрация — просто по нику, без паролей.</p>
  {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
  <form method="post" action="/register">
    <label for="nick">Ваш ник</label>
    <input id="nick" name="nick" type="text" placeholder="например, vanya_pi" required autofocus
           pattern="[A-Za-z0-9_.\-]{2,32}">
    <button class="btn btn-primary btn-block" type="submit">Войти / Зарегистрироваться</button>
  </form>
</div>
{% endblock %}
