<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} — Team Server (gitdiagram)</title>
<style>
  body { margin:0; background:#0d1117; color:#c9d1d9; font-family: ui-monospace, monospace; }
  #wrap { padding:24px; }
  svg { max-width:none; }
</style>
<script src="/static/mermaid.min.js"></script>
</head>
<body>
<div id="wrap"><pre class="mermaid">{{ code }}</pre></div>
<script>
  mermaid.initialize({ startOnLoad: false, theme: 'dark', flowchart: { useMaxWidth: false, htmlLabels: true } });
  const el = document.querySelector('.mermaid');
  const src = el.textContent;
  mermaid.render('diag', src).then(({ svg }) => {
    el.innerHTML = svg;
    window.__DIAGRAM_READY__ = true;
  }).catch(e => {
    el.textContent = 'Ошибка рендера: ' + e.message;
    window.__DIAGRAM_ERROR__ = String(e.message);
  });
</script>
</body>
</html>
